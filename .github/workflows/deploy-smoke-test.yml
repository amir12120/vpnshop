name: Deploy Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: E2E + negative test suites
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax lint (JS + bash)
        run: |
          node --check server.js
          node --check seed-admin.js
          for f in lib/*.js test/*.js scripts/*.js; do node --check "$f"; done
          bash -n INSTALL.sh
          bash -n vpnshop-cli.sh
          bash -n scripts/preflight.sh

      - name: Seed admin
        run: node seed-admin.js admin adminpass123

      - name: Boot mock Sanayi panel + shop
        run: |
          node test/mock-panel.js > mock.log 2>&1 &
          PORT=3000 node server.js > shop.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/ >/dev/null || { cat shop.log; exit 1; }

      - name: Run e2e suite (21 checks)
        run: node test/e2e.js 3000 2053

      - name: Run negative suite (26 checks)
        run: node test/e2e-negative.js 3000 2053

  installer-smoke:
    name: Full INSTALL.sh deploy on fresh Ubuntu
    runs-on: ubuntu-22.04
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Run INSTALL.sh non-interactively (domain mode, public port 8443, SSL off)
        # prompt order: Username / Password / Domain / Port [ / SSL choice ]
        run: printf 'admin\nadminpass123\nshop.test.local\n8443\n2\n' | sudo bash INSTALL.sh

      - name: Verify pre-flight + GitHub transport probe ran
        run: |
          # .repo-fetch-mode must exist and contain a valid mode
          mode=$(sudo cat /opt/vpnshop/.repo-fetch-mode)
          echo "repo fetch mode: $mode"
          grep -qE '^(git|tarball)$' <<<"$mode"

      - name: Force-update via git transport (exercises cmd_update)
        run: sudo vpnshop update

      - name: Verify nginx serves the public port and proxies to the internal backend
        run: |
          ok=""
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8443/ >/dev/null && ok=1 && break
            sleep 1
          done
          if [ "${ok:-}" != "1" ]; then sudo journalctl -u vpnshop -n 50 --no-pager; sudo nginx -t; exit 1; fi
          # public URL shape is http://Domain:Port — nginx on 8443, node internal on 3001
          curl -sf http://127.0.0.1:8443/login | grep -q "ورود"
          sudo grep -q "listen 8443;" /etc/nginx/sites-available/vpnshop
          sudo grep -q "Environment=PORT=8444" /etc/systemd/system/vpnshop.service
          sudo grep -q "Environment=HOST=127.0.0.1" /etc/systemd/system/vpnshop.service
          curl -sf http://127.0.0.1:8444/ >/dev/null && echo "internal backend on 8444 (loopback-only) OK"
          ! curl -sf --max-time 3 http://$(hostname -I | awk '{print $1}'):8444/ >/dev/null 2>&1 \
            && echo "internal port NOT reachable externally — good" \
            || { echo "internal port must not be reachable externally"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8443/admin)
          echo "GET /admin (anonymous) -> $code (302 expected: redirected to /login)"
          [ "$code" = "302" ]

      - name: Verify admin login works (session issued + panel renders)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -d 'username=admin&password=adminpass123' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            http://127.0.0.1:8443/login)
          echo "POST /login -> $code (302 expected)"
          [ "$code" = "302" ]
          cookie=$(curl -si -d 'username=admin&password=adminpass123' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            http://127.0.0.1:8443/login | grep -i '^set-cookie' | cut -d' ' -f2 | cut -d';' -f1)
          curl -s -H "Cookie: $cookie" http://127.0.0.1:8443/admin | grep -q "پنل مدیریت"
          echo "GET /admin with session -> renders admin panel"

      - name: CLI smoke (status / doctor / ports)
        run: |
          sudo vpnshop status
          sudo vpnshop doctor
          sudo vpnshop ports | head -8
          vpnshop --version

      - name: Uninstall --purge and verify clean removal
        run: |
          printf 'y\ny\n' | sudo vpnshop uninstall --purge
          sudo systemctl is-active vpnshop && exit 1 || echo "service removed"
          [ ! -d /opt/vpnshop ] && echo "app dir removed"
